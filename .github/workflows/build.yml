name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk maxlite-${{ github.ref_name }}.apk

      # На каждый пуш — APK в артефактах Actions
      - uses: actions/upload-artifact@v4
        with:
          name: maxlite-apk
          path: maxlite-*.apk

      # На тег v* — готовый релиз с APK
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: maxlite-*.apk
          generate_release_notes: true
