name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract version
        id: ver
        run: |
          name="${GITHUB_REF_NAME#v}"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Build debug APK
        run: >
          ./gradlew assembleDebug --no-daemon
          -PversionName=${{ steps.ver.outputs.name }}
          -PversionCode=${{ github.run_number }}

      # На каждый пуш — debug-APK в артефактах Actions, просто для проверки сборки.
      - uses: actions/upload-artifact@v4
        with:
          name: maxlite-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      # На тег v* — релизная сборка, подписанная приватным ключом из Secrets
      # (ключ никогда не лежит в репозитории).
      - name: Decode release keystore
        if: startsWith(github.ref, 'refs/tags/v')
        run: echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Build release APK
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: >
          ./gradlew assembleRelease --no-daemon
          -PversionName=${{ steps.ver.outputs.name }}
          -PversionCode=${{ github.run_number }}

      - name: Rename release APK
        if: startsWith(github.ref, 'refs/tags/v')
        run: cp app/build/outputs/apk/release/app-release.apk maxlite-${{ github.ref_name }}.apk

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: maxlite-*.apk
          generate_release_notes: true
